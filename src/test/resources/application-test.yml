spring:
  datasource:
    url: jdbc:h2:mem:sankhya_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  session:
    store-type: none

logging:
  level:
    com.sankhya: INFO
    org.springframework.security: WARN
