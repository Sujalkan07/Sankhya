spring:
  application:
    name: sankhya-platform
  profiles:
    active: dev
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        name: SANKHYA_SESSION
        http-only: true
        same-site: lax

# Reserved for future phases
sankhya:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
