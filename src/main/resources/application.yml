spring:
  application:
    name: sankhya-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 60m
      cookie:
        name: SANKHYA_SESSION
        http-only: true
        same-site: lax
        secure: false

sankhya:
  auth:
    dev-default-password: ${DEV_DEFAULT_PASSWORD:Password@123}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      timeout-seconds: ${GEMINI_TIMEOUT:30}
